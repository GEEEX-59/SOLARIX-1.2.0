<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4b1f83"/>
      <stop offset="50%" stop-color="#6d35b8"/>
      <stop offset="100%" stop-color="#8d5bd1"/>
    </linearGradient>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5cc"/>
      <stop offset="30%" stop-color="#ffcc00"/>
      <stop offset="100%" stop-color="#ff7700"/>
    </radialGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3c72"/>
      <stop offset="100%" stop-color="#2a5298"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>

  <!-- Glowing Sun -->
  <g filter="url(#glow)">
    <circle cx="256" cy="180" r="75" fill="url(#sunGrad)"/>
    <!-- Sun Rays -->
    <g stroke="#ffcc00" stroke-width="8" stroke-linecap="round" opacity="0.9">
      <line x1="256" y1="75" x2="256" y2="55"/>
      <line x1="256" y1="285" x2="256" y2="305"/>
      <line x1="151" y1="180" x2="131" y2="180"/>
      <line x1="361" y1="180" x2="381" y2="180"/>
      <line x1="181" y1="105" x2="167" y2="91"/>
      <line x1="331" y1="255" x2="345" y2="269"/>
      <line x1="181" y1="255" x2="167" y2="269"/>
      <line x1="331" y1="105" x2="345" y2="91"/>
    </g>
  </g>

  <!-- Solar Panel Grid -->
  <g transform="translate(0, 40)">
    <!-- Trapezoid solar array -->
    <polygon points="140,280 372,280 410,420 102,420" fill="url(#panelGrad)" stroke="#00e5ff" stroke-width="6" rx="10"/>
    <!-- Solar panel grid lines -->
    <line x1="140" y1="326" x2="372" y2="326" stroke="#00e5ff" stroke-width="3" opacity="0.8"/>
    <line x1="120" y1="373" x2="392" y2="373" stroke="#00e5ff" stroke-width="3" opacity="0.8"/>
    
    <line x1="256" y1="280" x2="256" y2="420" stroke="#00e5ff" stroke-width="4" opacity="0.9"/>
    <line x1="198" y1="280" x2="179" y2="420" stroke="#00e5ff" stroke-width="3" opacity="0.7"/>
    <line x1="314" y1="280" x2="333" y2="420" stroke="#00e5ff" stroke-width="3" opacity="0.7"/>
  </g>
</svg>
